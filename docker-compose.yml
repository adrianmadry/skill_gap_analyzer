services:
  postgres:
    image: postgres:16-alpine
    container_name: skillgap-db-postgres
    environment:
      POSTGRES_DB: skillgap_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d skillgap_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: skillgap-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/skillgap_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_JPA_SHOW_SQL: "false"
      JWT_SECRET_KEY: "/z/xPuKKSpCAWnm4Qs/9u4VGM0t7T9YdtQRvKviaOT0="
      ADMIN_EMAIL: "admin@test.com"
      ADMIN_PASSWORD: "password"
    ports:
      - "8080:8080"

volumes:
  pgdata: